<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">An AI coding agent turning code into a game mod: a code editor on the left feeds a pixel-art game world on the right</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="1" stop-color="#0d2a2e"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fb6"/>
      <stop offset="1" stop-color="#8fc3e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.05">
    <circle cx="220" cy="140" r="260"/><circle cx="1420" cy="780" r="300"/>
  </g>

  <!-- code editor -->
  <g transform="translate(110 170)">
    <rect width="620" height="560" rx="22" fill="#14111f" stroke="#3a3354" stroke-width="2"/>
    <rect width="620" height="56" rx="22" fill="#221d33"/>
    <rect y="34" width="620" height="22" fill="#221d33"/>
    <circle cx="34" cy="28" r="9" fill="#ff6b6b"/><circle cx="62" cy="28" r="9" fill="#ffd166"/><circle cx="90" cy="28" r="9" fill="#06d6a0"/>
    <text x="130" y="35" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#9a93b8">agent — mod-any-game</text>
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22">
      <text x="36" y="112" fill="#7f7a99">$ um recon ./MyGame</text>
      <text x="36" y="152" fill="#06d6a0">✓ engine: .NET / XNA</text>
      <text x="36" y="192" fill="#06d6a0">✓ route: managed patch</text>
      <text x="36" y="232" fill="#7f7a99">$ build mod "black-hole gun"</text>
    </g>
    <g>
      <rect x="36" y="262" width="300" height="16" rx="8" fill="#c792ea"/>
      <rect x="352" y="262" width="150" height="16" rx="8" fill="#82aaff"/>
      <rect x="60" y="298" width="220" height="16" rx="8" fill="#82aaff"/>
      <rect x="296" y="298" width="240" height="16" rx="8" fill="#f78c6c"/>
      <rect x="60" y="334" width="380" height="16" rx="8" fill="#c3e88d"/>
      <rect x="84" y="370" width="180" height="16" rx="8" fill="#ffcb6b"/>
      <rect x="280" y="370" width="200" height="16" rx="8" fill="#89ddff"/>
      <rect x="60" y="406" width="140" height="16" rx="8" fill="#c792ea"/>
      <rect x="36" y="442" width="90" height="16" rx="8" fill="#82aaff"/>
    </g>
    <text x="36" y="510" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="22" fill="#ffd166">▶ testing in game…</text>
  </g>

  <!-- arrow -->
  <g transform="translate(760 450)">
    <path d="M0 0 H70" stroke="#ffd166" stroke-width="10" stroke-linecap="round"/>
    <path d="M58 -24 L92 0 L58 24" fill="none" stroke="#ffd166" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- pixel game window -->
  <g transform="translate(880 170)">
    <rect width="620" height="560" rx="22" fill="#0f1b2b" stroke="#2c4a63" stroke-width="2"/>
    <clipPath id="screen"><rect x="20" y="20" width="580" height="520" rx="12"/></clipPath>
    <g clip-path="url(#screen)">
      <rect x="20" y="20" width="580" height="520" fill="url(#sky)"/>
      <!-- clouds -->
      <g fill="#ffffff" opacity="0.85">
        <rect x="250" y="120" width="120" height="24"/><rect x="270" y="96" width="72" height="24"/>
        <rect x="380" y="110" width="144" height="24"/><rect x="404" y="86" width="72" height="24"/>
      </g>
      <!-- hills -->
      <path d="M20 400 L140 320 L260 380 L380 300 L520 370 L600 330 L600 540 L20 540 Z" fill="#3f7d4e"/>
      <!-- ground blocks -->
      <g>
        <rect x="20" y="440" width="580" height="100" fill="#7a4b2a"/>
        <rect x="20" y="440" width="580" height="24" fill="#5bb04d"/>
        <g fill="#6a3f22">
          <rect x="60" y="484" width="24" height="24"/><rect x="180" y="500" width="24" height="24"/>
          <rect x="320" y="488" width="24" height="24"/><rect x="460" y="504" width="24" height="24"/>
        </g>
      </g>
      <!-- hero -->
      <g transform="translate(170 344)">
        <rect x="16" y="0" width="40" height="32" fill="#f2c99b"/>
        <rect x="16" y="0" width="40" height="10" fill="#4a2f1d"/>
        <rect x="24" y="14" width="8" height="8" fill="#1b1430"/><rect x="40" y="14" width="8" height="8" fill="#1b1430"/>
        <rect x="8" y="32" width="56" height="40" fill="#3b82c4"/>
        <rect x="16" y="72" width="16" height="24" fill="#2d2a40"/><rect x="40" y="72" width="16" height="24" fill="#2d2a40"/>
        <rect x="64" y="40" width="16" height="12" fill="#f2c99b"/>
      </g>
      <!-- new modded weapon with glow -->
      <circle cx="310" cy="350" r="90" fill="url(#glow)"/>
      <g transform="translate(250 330)">
        <rect x="0" y="12" width="96" height="20" fill="#7c5cff"/>
        <rect x="96" y="6" width="28" height="32" fill="#c3b3ff"/>
        <rect x="12" y="32" width="16" height="22" fill="#4b3a99"/>
        <rect x="40" y="0" width="12" height="12" fill="#ffe27a"/>
      </g>
      <!-- black hole projectile -->
      <circle cx="470" cy="320" r="34" fill="#120c24"/>
      <circle cx="470" cy="320" r="44" fill="none" stroke="#a78bfa" stroke-width="6" stroke-dasharray="14 10"/>
      <!-- sparkle -->
      <g fill="#ffe27a">
        <rect x="372" y="250" width="8" height="24"/><rect x="364" y="258" width="24" height="8"/>
        <rect x="540" y="400" width="6" height="18"/><rect x="534" y="406" width="18" height="6"/>
      </g>
      <!-- HUD -->
      <rect x="40" y="40" width="190" height="34" rx="6" fill="#000000" opacity="0.45"/>
      <rect x="52" y="52" width="120" height="10" fill="#ff6b6b"/>
      <rect x="440" y="40" width="140" height="34" rx="6" fill="#000000" opacity="0.45"/>
      <text x="510" y="64" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="18" fill="#ffe27a">NEW MOD</text>
    </g>
  </g>
</svg>
